name: Publish Docker Image
run-name: "Publish ${{ github.sha }} to Docker Hub"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            mtauha/psx-warehouse:latest
            mtauha/psx-warehouse:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy:
    name: Deploy Cloud Run Job
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15
    # One deploy at a time; ordering is enforced in the step (only the head of
    # main deploys).
    concurrency:
      group: deploy-cloud-run-job
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      # The job pulls the Docker Hub image through the project's "dockerhub"
      # Artifact Registry remote repository, not through mirror.gcr.io (see
      # infra/artifact_registry.tf). A failed update still writes the new image
      # into the job spec and leaves the job not Ready, so on failure the last
      # image that was Ready is put back.
      - name: Update Cloud Run Job to the just-built digest
        env:
          PROJECT: ${{ vars.GCP_PROJECT }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          new_image="us-central1-docker.pkg.dev/$PROJECT/dockerhub/mtauha/psx-warehouse@$DIGEST"
          job=(psx-warehouse-extract --region=us-central1 --project="$PROJECT")

          # Skip if a newer commit is already on main; its run deploys instead.
          # If that run's build fails, nothing deploys until the next push.
          # (ls-remote works without a checkout because the repo is public.)
          head_sha=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "main is now at $head_sha, not $GITHUB_SHA; leaving the deploy to that run"
            exit 0
          fi

          # Remember the current image only if the job is healthy, so a rollback
          # never restores a broken spec. A missing condition counts as not Ready.
          current=$(gcloud run jobs describe "${job[@]}" --format=json)
          ready=$(jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // "Unknown"' <<<"$current")
          prev_image=""
          if [ "$ready" = "True" ]; then
            prev_image=$(jq -r '.spec.template.spec.template.spec.containers[0].image // empty' <<<"$current")
          fi

          if gcloud run jobs update "${job[@]}" --image="$new_image"; then
            echo "Deployed $new_image"
            exit 0
          fi

          echo "::error::Could not deploy $new_image"
          if [ -z "$prev_image" ]; then
            echo "::error::No healthy image to roll back to; the job is not Ready and scheduled runs will fail"
          elif gcloud run jobs update "${job[@]}" --image="$prev_image"; then
            echo "Rolled back to $prev_image"
          else
            echo "::error::Rollback to $prev_image also failed; the job is not Ready and scheduled runs will fail"
          fi
          exit 1
