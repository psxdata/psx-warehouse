name: Publish Docker Image
run-name: "Publish ${{ github.sha }} to Docker Hub"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            mtauha/psx-warehouse:latest
            mtauha/psx-warehouse:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    outputs:
      digest: ${{ steps.build.outputs.digest }}

  deploy:
    name: Deploy Cloud Run Job
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      id-token: write
      contents: read
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Update Cloud Run Job to the just-built digest
        run: |
          gcloud run jobs update psx-warehouse-extract \
            --region=us-central1 \
            --project=${{ vars.GCP_PROJECT }} \
            --image=docker.io/mtauha/psx-warehouse@${{ needs.docker.outputs.digest }}
