name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run ruff
        run: uv run ruff check extract/
      - name: Run mypy
        run: uv run mypy extract/

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run pytest
        run: uv run pytest tests/ -v

  dbt-validate:
    name: dbt-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dbt
      - name: Install dbt packages
        working-directory: dbt
        run: uv run --project .. dbt deps
      - name: Write stub profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          psx_warehouse:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: dummy-project
                dataset: dummy_dataset
                threads: 1
          EOF
      - name: dbt parse
        working-directory: dbt
        run: uv run --project .. dbt parse
