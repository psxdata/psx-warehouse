name: 'psx_warehouse'
version: '1.0.0'
config-version: 2

profile: 'psx_warehouse'

model-paths: ["models"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  psx_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      +persist_docs:
        relation: true
        columns: true

snapshots:
  psx_warehouse:
    +persist_docs:
      relation: true
      columns: true
